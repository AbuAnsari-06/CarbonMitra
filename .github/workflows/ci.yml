name: CarbonMitra CI/CD & Deployment Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      deploy_contract:
        description: 'Deploy Smart Contract to Polygon Amoy Testnet'
        required: false
        type: boolean
        default: false

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests (Firebase Emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JRE (for Firebase Emulator Suite)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Frontend & Root Dependencies
        run: npm ci || npm install

      - name: Install Functions Dependencies
        run: |
          if [ -f "functions/package.json" ]; then
            cd functions && npm ci || npm install && cd ..
          fi

      - name: Run Linters (Frontend & Functions)
        run: |
          npm run lint
          if [ -f "functions/package.json" ]; then
            cd functions && npm run lint && cd ..
          fi

      - name: Run Unit Tests (NDVI & Carbon Score)
        run: npm run test:unit

      - name: Run API & Functions Integration Tests
        run: npm run test:integration

      - name: Run End-to-End Test Suite
        run: npm run test:e2e

  hardhat-contracts:
    name: Polygon Amoy Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Smart Contracts
        run: npx hardhat compile

      - name: Run Hardhat Contract Tests
        run: npm run test:contracts

  deploy-hosting:
    name: Deploy React Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    needs: [lint-and-test, hardhat-contracts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build React Application
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBONMITRA }}'
          channelId: live
          projectId: carbonmitra-app

  deploy-contract-amoy:
    name: Deploy Smart Contract to Polygon Amoy
    runs-on: ubuntu-latest
    needs: [hardhat-contracts]
    if: github.event.inputs.deploy_contract == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Deploy Contract to Polygon Amoy Network
        env:
          POLYGON_AMOY_RPC_URL: ${{ secrets.POLYGON_AMOY_RPC_URL }}
          BACKEND_WALLET_PRIVATE_KEY: ${{ secrets.BACKEND_WALLET_PRIVATE_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          npx hardhat run scripts/deployAndVerify.ts --network polygonAmoy
